<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070913" />
  <meta name="description" content="FluxFrame Studio Pro — Advanced GPU-accelerated motion video & graphic generator powered by WebGL, Web Audio, and Tailwind CSS." />
  <title>FluxFrame Studio — Procedural Motion Video Generator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;600;700;800;900&family=Cinzel:wght@700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            space: ['"Space Grotesk"', 'sans-serif'],
            outfit: ['"Outfit"', 'sans-serif'],
            syne: ['"Syne"', 'sans-serif'],
            cinzel: ['"Cinzel"', 'serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              950: '#06070d',
              900: '#0a0d18',
              850: '#0e1222',
              800: '#141a30',
              700: '#1e2646',
              600: '#2b365e',
            }
          },
          boxShadow: {
            'glow-indigo': '0 0 25px -5px rgba(99, 102, 241, 0.45)',
            'glow-cyan': '0 0 25px -5px rgba(6, 182, 212, 0.45)',
            'glow-rose': '0 0 25px -5px rgba(244, 63, 94, 0.45)',
            'glow-amber': '0 0 25px -5px rgba(245, 158, 11, 0.45)',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-dark-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-brand-500 selection:text-white">

  <!-- BACKGROUND GLOW AMBIENCE -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-40 left-1/3 w-[650px] h-[650px] bg-brand-600/10 rounded-full blur-[140px]"></div>
    <div class="absolute -bottom-40 right-1/4 w-[650px] h-[650px] bg-cyan-600/10 rounded-full blur-[140px]"></div>
  </div>

  <div class="relative z-10 max-w-[1740px] mx-auto p-3 sm:p-5 lg:p-6 flex flex-col gap-4 sm:gap-6 min-h-screen">
    
    <!-- TOP NAVIGATION BAR -->
    <header class="h-16 px-4 sm:px-6 rounded-2xl bg-dark-900/80 backdrop-blur-xl border border-dark-700/60 shadow-2xl flex items-center justify-between gap-4">
      <!-- BRAND LOGO -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white shadow-glow-indigo">
          <i data-lucide="layers" class="w-5 h-5"></i>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-outfit font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">FluxFrame</span>
          <span class="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded-full bg-brand-500/15 border border-brand-500/30 text-brand-400">STUDIO PRO</span>
        </div>
      </div>

      <!-- AI PROMPT-TO-SCENE TRIGGER -->
      <div class="hidden md:flex items-center gap-2 flex-1 max-w-md mx-4">
        <div class="relative w-full">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="aiPromptInput" placeholder="AI Prompt (e.g., 'Cyberpunk crypto event', 'Luxury watch launch')..." class="w-full bg-dark-950/90 border border-dark-700/80 rounded-xl pl-9 pr-20 py-1.5 text-xs text-white focus:border-brand-500 focus:outline-none placeholder:text-slate-500 transition" />
          <button type="button" id="aiGenerateBtn" class="absolute right-1.5 top-1/2 -translate-y-1/2 px-2.5 py-0.5 rounded-lg bg-brand-500 hover:bg-brand-600 text-[11px] font-extrabold text-white transition active:scale-95">Generate</button>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="shareLinkBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-dark-800/80 hover:bg-dark-700 border border-dark-700 text-slate-300 hover:text-white text-xs font-bold transition" title="Copy shareable link">
          <i data-lucide="share-2" class="w-3.5 h-3.5 text-brand-400"></i>
          <span class="hidden sm:inline">Share URL</span>
        </button>

        <button id="snapshotBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-dark-800/80 hover:bg-dark-700 border border-dark-700 text-slate-300 hover:text-white text-xs font-bold transition" title="Download High-Res 4K Frame">
          <i data-lucide="camera" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span class="hidden sm:inline">Poster PNG</span>
        </button>
        
        <button id="clearBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-dark-800/80 hover:bg-dark-700 border border-dark-700 text-slate-300 hover:text-white text-xs font-bold transition">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Reset</span>
        </button>

        <button id="exportBtn" class="flex items-center gap-2 px-5 py-2 rounded-xl bg-white hover:bg-slate-100 text-dark-950 text-xs font-extrabold shadow-lg shadow-white/10 transition active:scale-95">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span id="exportBtnText">Export Video</span>
        </button>
      </div>
    </header>

    <!-- MAIN WORKSPACE GRID -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-5 flex-1 items-start">
      
      <!-- CONTROLS SIDEBAR (5 COLS) -->
      <aside class="lg:col-span-5 bg-dark-900/90 backdrop-blur-xl border border-dark-700/60 rounded-3xl p-5 sm:p-6 shadow-2xl flex flex-col gap-5 max-h-[calc(100vh-120px)] overflow-y-auto custom-scrollbar">
        
        <div class="flex items-center justify-between pb-3 border-b border-dark-700/50">
          <div>
            <h2 class="text-base font-extrabold tracking-tight text-white font-outfit">Scene Designer</h2>
            <p class="text-xs text-slate-400">8 Visual Shaders, AI Prompts & Audio Engine</p>
          </div>
          <!-- Quick Preset Dropdown -->
          <div class="flex items-center gap-1.5">
            <select id="quickPresetSelect" class="bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1 text-[11px] font-bold text-brand-300 focus:outline-none">
              <option value="" disabled selected>⚡ Quick Presets</option>
              <option value="launch">🚀 Product Launch</option>
              <option value="solar">🔥 Solar Keynote</option>
              <option value="cyber">⚡ Cyberpunk Synth</option>
              <option value="aurora">🌌 Cosmic Aurora</option>
              <option value="reels">📱 Story / Reel (9:16)</option>
              <option value="podcast">🎙️ Podcast Episode</option>
            </select>
          </div>
        </div>

        <!-- 8 VISUAL SHADERS -->
        <div class="flex flex-col gap-2.5">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center justify-between">
            <span class="flex items-center gap-1.5"><i data-lucide="palette" class="w-3.5 h-3.5 text-brand-400"></i> Visual Shader Style</span>
            <span class="text-[10px] text-brand-400 font-bold">8 Styles</span>
          </label>
          <div class="grid grid-cols-2 gap-2" id="styleGrid">
            <!-- 1. Silk Flow -->
            <button type="button" class="style-card active group" data-style="silk">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 via-blue-500 to-cyan-400 border border-white/20 shadow-md flex-shrink-0"></div>
              <div class="text-left overflow-hidden">
                <div class="text-xs font-bold text-white group-hover:text-brand-400 truncate">Silk Flow</div>
                <div class="text-[10px] text-slate-400 truncate">Apple fluid mesh</div>
              </div>
            </button>

            <!-- 2. Solar Flare -->
            <button type="button" class="style-card group" data-style="solar">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-500 via-rose-500 to-yellow-300 border border-white/20 shadow-md flex-shrink-0"></div>
              <div class="text-left overflow-hidden">
                <div class="text-xs font-bold text-white group-hover:text-amber-400 truncate">Solar Flare</div>
                <div class="text-[10px] text-slate-400 truncate">Fiery golden rays</div>
              </div>
            </button>

            <!-- 3. Cosmic Aurora -->
            <button type="button" class="style-card group" data-style="aurora">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-500 via-teal-400 to-cyan-500 border border-white/20 shadow-md flex-shrink-0"></div>
              <div class="text-left overflow-hidden">
                <div class="text-xs font-bold text-white group-hover:text-emerald-400 truncate">Cosmic Aurora</div>
                <div class="text-[10px] text-slate-400 truncate">Northern plasma</div>
              </div>
            </button>

            <!-- 4. Cyber Wave Grid -->
            <button type="button" class="style-card group" data-style="cyber">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-pink-600 via-purple-600 to-cyan-400 border border-white/20 shadow-md flex-shrink-0"></div>
              <div class="text-left overflow-hidden">
                <div class="text-xs font-bold text-white group-hover:text-pink-400 truncate">Cyber Wave</div>
                <div class="text-[10px] text-slate-400 truncate">Synthwave 3D grid</div>
              </div>
            </button>

            <!-- 5. Liquid Chrome -->
            <button type="button" class="style-card group" data-style="chrome">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-slate-600 via-slate-300 to-slate-100 border border-white/20 shadow-md flex-shrink-0"></div>
              <div class="text-left overflow-hidden">
                <div class="text-xs font-bold text-white group-hover:text-cyan-400 truncate">Liquid Chrome</div>
                <div class="text-[10px] text-slate-400 truncate">Metallic ripples</div>
              </div>
            </button>

            <!-- 6. Obsidian Darkroom -->
            <button type="button" class="style-card group" data-style="obsidian">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-slate-900 via-slate-800 to-indigo-950 border border-white/20 shadow-md flex-shrink-0"></div>
              <div class="text-left overflow-hidden">
                <div class="text-xs font-bold text-white group-hover:text-indigo-400 truncate">Obsidian</div>
                <div class="text-[10px] text-slate-400 truncate">Cinematic bokeh</div>
              </div>
            </button>

            <!-- 7. Prism Glass -->
            <button type="button" class="style-card group" data-style="prism">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-rose-500 via-violet-500 to-sky-400 border border-white/20 shadow-md flex-shrink-0"></div>
              <div class="text-left overflow-hidden">
                <div class="text-xs font-bold text-white group-hover:text-violet-400 truncate">Prism Glass</div>
                <div class="text-[10px] text-slate-400 truncate">Holographic optics</div>
              </div>
            </button>

            <!-- 8. Warp Speed -->
            <button type="button" class="style-card group" data-style="warp">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-900 via-indigo-600 to-cyan-300 border border-white/20 shadow-md flex-shrink-0"></div>
              <div class="text-left overflow-hidden">
                <div class="text-xs font-bold text-white group-hover:text-cyan-400 truncate">Warp Speed</div>
                <div class="text-[10px] text-slate-400 truncate">Hyperspace tunnel</div>
              </div>
            </button>
          </div>

          <select id="styleSelect" class="sr-only" aria-label="Visual Style Select">
            <option value="silk">Silk Flow</option>
            <option value="solar">Solar Flare</option>
            <option value="aurora">Cosmic Aurora</option>
            <option value="cyber">Cyber Wave</option>
            <option value="chrome">Liquid Chrome</option>
            <option value="obsidian">Obsidian</option>
            <option value="prism">Prism Glass</option>
            <option value="warp">Warp Speed</option>
          </select>
        </div>

        <!-- COPY & HEADLINES -->
        <div class="flex flex-col gap-3">
          <!-- Category Badge Pill -->
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center justify-between mb-1.5">
              <span>Category Badge Pill (Optional)</span>
              <span class="text-[10px] text-slate-500 lowercase">e.g. KEYNOTE, V2.0</span>
            </label>
            <input type="text" id="badgeInput" maxlength="30" value="FEATURE LAUNCH" placeholder="e.g. NEW RELEASE, PROMOTION..." class="w-full bg-dark-950/80 border border-dark-700/80 rounded-xl px-3.5 py-2 text-xs font-bold tracking-wider text-brand-300 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500/50 transition placeholder:text-slate-600" />
          </div>

          <!-- Main Title -->
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Main Title / Headline</label>
            <input type="text" id="titleInput" maxlength="42" value="DESIGN THE FUTURE" placeholder="Enter headline..." class="w-full bg-dark-950/80 border border-dark-700/80 rounded-xl px-3.5 py-2 text-xs font-bold text-white focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500/50 transition placeholder:text-slate-600" />
          </div>

          <!-- Subtitle -->
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Subtitle / Tagline</label>
            <input type="text" id="subtitleInput" maxlength="70" value="High-fidelity procedural motion graphics in real-time" placeholder="Enter subtitle..." class="w-full bg-dark-950/80 border border-dark-700/80 rounded-xl px-3.5 py-2 text-xs font-medium text-slate-300 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500/50 transition placeholder:text-slate-600" />
          </div>
        </div>

        <!-- TYPOGRAPHY & ALIGNMENT CONTROLS -->
        <div class="grid grid-cols-3 gap-2.5">
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Font</label>
            <select id="fontSelect" class="w-full bg-dark-950/80 border border-dark-700/80 rounded-xl px-2.5 py-2 text-xs font-semibold text-white focus:border-brand-500 focus:outline-none transition">
              <option value="Plus Jakarta Sans" selected>Plus Jakarta Sans</option>
              <option value="Space Grotesk">Space Grotesk</option>
              <option value="Outfit">Outfit</option>
              <option value="Syne">Syne</option>
              <option value="Cinzel">Cinzel</option>
              <option value="JetBrains Mono">JetBrains Mono</option>
            </select>
          </div>

          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Motion</label>
            <select id="motionSelect" class="w-full bg-dark-950/80 border border-dark-700/80 rounded-xl px-2.5 py-2 text-xs font-semibold text-white focus:border-brand-500 focus:outline-none transition">
              <option value="fade-rise" selected>Rise & Fade</option>
              <option value="scale-pop">Scale Pop</option>
              <option value="kinetic-drift">Drift Zoom</option>
              <option value="glitch-flash">Flash Punch</option>
            </select>
          </div>

          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Align</label>
            <div class="grid grid-cols-3 bg-dark-950/80 p-1 rounded-xl border border-dark-700/80" id="alignControl">
              <button type="button" class="seg-btn" data-align="left" title="Left Align"><i data-lucide="align-left" class="w-3.5 h-3.5 mx-auto"></i></button>
              <button type="button" class="seg-btn active" data-align="center" title="Center Align"><i data-lucide="align-center" class="w-3.5 h-3.5 mx-auto"></i></button>
              <button type="button" class="seg-btn" data-align="right" title="Right Align"><i data-lucide="align-right" class="w-3.5 h-3.5 mx-auto"></i></button>
            </div>
            <select id="alignSelect" class="sr-only" aria-label="Text Align Select">
              <option value="center" selected>Center</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </div>
        </div>

        <!-- ASPECT RATIO & DURATION -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Aspect Ratio</label>
            <div class="grid grid-cols-3 bg-dark-950/80 p-1 rounded-xl border border-dark-700/80" id="aspectControl">
              <button type="button" class="seg-btn active" data-aspect="16:9">16:9</button>
              <button type="button" class="seg-btn" data-aspect="9:16">9:16</button>
              <button type="button" class="seg-btn" data-aspect="1:1">1:1</button>
            </div>
            <select id="aspectSelect" class="sr-only" aria-label="Aspect Select">
              <option value="16:9" selected>16:9</option>
              <option value="9:16">9:16</option>
              <option value="1:1">1:1</option>
            </select>
          </div>

          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Duration</label>
            <div class="grid grid-cols-4 bg-dark-950/80 p-1 rounded-xl border border-dark-700/80" id="durationControl">
              <button type="button" class="seg-btn" data-duration="4">4s</button>
              <button type="button" class="seg-btn active" data-duration="5">5s</button>
              <button type="button" class="seg-btn" data-duration="8">8s</button>
              <button type="button" class="seg-btn" data-duration="10">10s</button>
            </div>
            <select id="durationSelect" class="sr-only" aria-label="Duration Select">
              <option value="4">4s</option>
              <option value="5" selected>5s</option>
              <option value="8">8s</option>
              <option value="10">10s</option>
            </select>
          </div>
        </div>

        <!-- SHADER SPEED & FILM GRAIN CONTROLS -->
        <div class="grid grid-cols-2 gap-3 bg-dark-950/50 p-3 rounded-2xl border border-dark-700/70">
          <div>
            <div class="flex items-center justify-between text-xs font-bold text-slate-400 mb-1">
              <span>Speed Multiplier</span>
              <span id="speedValueLabel" class="text-brand-400">1.0x</span>
            </div>
            <input type="range" id="speedSlider" min="0.3" max="2.5" step="0.1" value="1.0" class="w-full accent-brand-500 cursor-pointer h-1.5 bg-dark-800 rounded-lg" />
          </div>

          <div class="flex items-center justify-between pt-2">
            <div>
              <span class="text-xs font-bold text-slate-300 block">Film Grain Overlay</span>
              <span class="text-[10px] text-slate-500">Cinematic noise</span>
            </div>
            <button type="button" id="grainToggle" class="w-10 h-5 rounded-full bg-dark-700 relative transition-colors focus:outline-none" aria-pressed="false">
              <span class="w-4 h-4 rounded-full bg-white absolute top-0.5 left-0.5 transition-transform" id="grainToggleKnob"></span>
            </button>
          </div>
        </div>

        <!-- COLOR PALETTE MOOD -->
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Accent Lighting Color</label>
          <div class="flex items-center justify-between bg-dark-950/80 p-2 rounded-xl border border-dark-700/80">
            <div class="flex items-center gap-1.5" id="colorChips">
              <button type="button" class="chip active" data-color="#6366f1" style="--chip:#6366f1" title="Electric Indigo"></button>
              <button type="button" class="chip" data-color="#06b6d4" style="--chip:#06b6d4" title="Ocean Cyan"></button>
              <button type="button" class="chip" data-color="#f59e0b" style="--chip:#f59e0b" title="Solar Gold"></button>
              <button type="button" class="chip" data-color="#f43f5e" style="--chip:#f43f5e" title="Sunset Coral"></button>
              <button type="button" class="chip" data-color="#10b981" style="--chip:#10b981" title="Emerald Glow"></button>
              <button type="button" class="chip" data-color="#a855f7" style="--chip:#a855f7" title="Neon Violet"></button>
              <button type="button" class="chip" data-color="#ffffff" style="--chip:#ffffff" title="Pure Frost"></button>
            </div>
            <div class="flex items-center gap-1.5 text-xs font-bold text-slate-400 cursor-pointer pr-1">
              <input type="color" id="customColorPicker" value="#6366f1" class="w-5 h-5 rounded-full cursor-pointer bg-transparent border-none appearance-none" />
              <span>Custom</span>
            </div>
          </div>
        </div>

        <!-- LOGO WATERMARK & POSITION -->
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Logo & Position</label>
            <select id="logoPosSelect" class="bg-dark-950 text-slate-300 text-[11px] font-semibold border border-dark-700 rounded-lg px-2 py-0.5 focus:outline-none">
              <option value="above-title" selected>Above Title</option>
              <option value="top-left">Top-Left Corner</option>
              <option value="top-center">Top-Center</option>
              <option value="bottom-right">Bottom-Right Corner</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label for="logoUpload" class="flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-dark-950/80 border border-dashed border-dark-700 hover:border-brand-500/70 text-slate-400 hover:text-white text-xs font-semibold cursor-pointer transition">
              <i data-lucide="upload-cloud" class="w-4 h-4 text-brand-400"></i>
              <span id="logoFileName">Upload PNG / SVG Logo</span>
            </label>
            <input type="file" id="logoUpload" accept="image/png,image/svg+xml,image/webp,image/jpeg" class="sr-only" />
            <button type="button" id="removeLogoBtn" class="w-9 h-9 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20 grid place-items-center text-xs font-bold transition" style="display:none;" title="Remove Logo">✕</button>
          </div>
        </div>

        <!-- GENERATIVE AUDIO OR CUSTOM AUDIO -->
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Audio Soundtrack</label>
            <label for="customAudioUpload" class="text-[11px] text-brand-400 hover:text-brand-300 font-bold cursor-pointer flex items-center gap-1">
              <i data-lucide="music" class="w-3 h-3"></i> <span id="customAudioLabel">Upload MP3/WAV</span>
            </label>
            <input type="file" id="customAudioUpload" accept="audio/mp3,audio/wav,audio/aac,audio/m4a,audio/ogg" class="sr-only" />
          </div>
          <div class="flex items-center gap-2">
            <select id="audioSoundSelect" class="flex-1 bg-dark-950/80 border border-dark-700/80 rounded-xl px-3 py-2 text-xs font-semibold text-white focus:border-brand-500 focus:outline-none transition">
              <option value="ambient">Harmonic Ambient Pad (Warm C Maj9)</option>
              <option value="solar">Solar Energy Pulse (Golden Frequency)</option>
              <option value="cosmic">Cosmic Space Resonance (Deep Filter)</option>
              <option value="lofi">Lo-Fi Tape Drone (Mellow Warmth)</option>
              <option value="custom" id="customAudioOption" disabled>Custom Uploaded Audio</option>
            </select>
            <button type="button" id="audioToggle" class="px-3 py-2 rounded-xl bg-brand-500/15 border border-brand-500/40 text-brand-300 hover:bg-brand-500/25 flex items-center gap-1.5 text-xs font-bold transition" title="Toggle sound mute/unmute">
              <i data-lucide="volume-2" class="w-4 h-4"></i>
              <span id="audioStatusText">ON</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- RIGHT PREVIEW VIEWPORT (7 COLS) -->
      <section class="lg:col-span-7 bg-dark-900/90 backdrop-blur-xl border border-dark-700/60 rounded-3xl p-5 sm:p-6 shadow-2xl flex flex-col gap-4">
        
        <!-- STAGE HEADER -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-sm font-extrabold text-white font-outfit">Live Canvas Stage</span>
            <span class="text-slate-500">•</span>
            <span id="resolutionBadge" class="text-xs font-mono font-bold text-slate-400">1920 × 1080 (16:9)</span>
          </div>
          
          <div class="flex items-center gap-2">
            <span id="timeLabel" class="text-xs font-mono font-bold text-brand-400 bg-brand-500/10 border border-brand-500/20 px-2.5 py-1 rounded-lg">00:00 / 00:05</span>
            <button id="playBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-dark-800 border border-dark-700 text-xs font-bold text-white hover:bg-dark-700 transition">
              <i data-lucide="pause" class="w-3.5 h-3.5" id="playIcon"></i>
              <span id="playBtnText">Pause</span>
            </button>
            <button id="restartBtn" class="p-1.5 rounded-lg bg-dark-800 border border-dark-700 text-slate-300 hover:text-white hover:bg-dark-700 transition" title="Restart">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>

        <!-- CANVAS CONTAINER (PERFECTLY CONTAINED) -->
        <div class="w-full h-[520px] max-h-[calc(100vh-270px)] min-h-[380px] bg-dark-950 rounded-2xl border border-dark-700/80 p-3 sm:p-5 flex items-center justify-center overflow-hidden relative shadow-inner" id="stageContainer">
          <div class="w-full h-full flex items-center justify-center" id="stageWrap">
            <canvas id="renderCanvas" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl shadow-black/80 border border-white/10"></canvas>
          </div>
        </div>

        <!-- TIMELINE SCRUBBER -->
        <div class="py-1 cursor-pointer select-none" id="timelineWrap">
          <div class="h-2 bg-dark-800 rounded-full relative overflow-visible">
            <div class="h-full bg-gradient-to-r from-brand-500 via-indigo-400 to-cyan-400 rounded-full shadow-glow-indigo transition-all duration-75" id="progressBar" style="width: 0%;"></div>
            <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-white rounded-full shadow-lg shadow-brand-500/50 pointer-events-none opacity-0 hover:opacity-100 transition" id="progressHandle" style="left: 0%;"></div>
          </div>
        </div>

        <!-- FOOTER STATUS & TOAST NOTIFICATION -->
        <div class="flex items-center justify-between text-xs pt-1 border-t border-dark-700/50">
          <div class="flex items-center gap-3 text-slate-400 font-medium">
            <span class="flex items-center gap-1"><i data-lucide="cpu" class="w-3.5 h-3.5 text-brand-400"></i> 60 FPS WebGL 2.0</span>
            <span>•</span>
            <span class="flex items-center gap-1"><i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i> Zero Cloud Server</span>
          </div>
          <div class="font-bold text-emerald-400 flex items-center gap-1.5" id="renderStatus">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Ready to render
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- TOAST NOTIFICATION (POPUP) -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-xl bg-dark-900 border border-brand-500/50 text-white text-xs font-bold shadow-2xl shadow-brand-500/20 flex items-center gap-2 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMessage">Link copied to clipboard!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
